  mainCopyrightOwner: Entur AS

maintenance:
  type: internal
  contacts:
    - name: Entur ROR (Open Data and Journey Planning)
      email: kollektivdata@entur.org

localisation:
  localisationReady: false
  availableLanguages:
    - en

dependsOn:
  open:
    - name: PostgreSQL
