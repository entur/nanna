# publiccode.yml metadata, see https://yml.publiccode.tools/
publiccodeYmlVersion: "0.7.0"

name: Nanna
url: https://github.com/entur/nanna

platforms:
  - web
  - linux

categories:
  - data-collection
  - it-management

developmentStatus: stable
softwareType: standalone/backend

organisation:
  name: Entur AS
  uri: https://entur.no

usedBy:
  - Norway (nationwide), Entur AS

intendedAudience:
  scope:
    - transportation
  countries:
    - "NO"

description:
  en:
    localisedName: Nanna
    shortDescription: Provider registry for the timetable data pipeline.
    longDescription: >
      Nanna stores data providers, their NeTEx codespaces and the per-provider configuration deciding how
      deliveries are imported, validated and exported. Served over a REST API, scoped by the caller's user
      context.
    documentation: https://github.com/entur/nanna/blob/main/README.md
    features:
      - Registry of data providers and NeTEx codespaces
      - Per-provider pipeline and export configuration
      - REST API scoped by user context

legal:
