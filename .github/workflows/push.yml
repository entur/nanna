name: Build, push and deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  maven-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Temurin, matching the distroless runtime. Not liberica: setup-java drops its fourth
      # version component and can pick an unpatched build.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-
            ${{ runner.os }}-

      - name: Run maven build
        run: mvn verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/*.jar
      - name: Sonar Scan
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.ENTUR_SONAR_PASSWORD }}
          SONAR_PROJECT_NAME: ${{ github.event.repository.name }}
          SONAR_PROJECT_KEY: entur_${{ github.event.repository.name }}
        run: |
          mvn \
                  org.jacoco:jacoco-maven-plugin:prepare-agent verify \
                  org.jacoco:jacoco-maven-plugin:report sonar:sonar \
                  -Dmaven.main.skip \
                  -DskipTests \
                  -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
                  -Dsonar.organization=enturas-github \
                  -Dsonar.projectName=${SONAR_PROJECT_NAME} \
                  -Dsonar.host.url=https://sonarcloud.io \
                  -Dsonar.token=${SONAR_TOKEN}
  docker-smoke:
    needs: [maven-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact
          path: target
      - run: docker build -t nanna:smoke .
      # Nothing else in CI runs the image. Reaching Spring's startup line proves the JRE loaded the
      # application bytecode; it then fails on config that only exists in the cluster, which is fine.
      # A wrong class file version or an unusable base image never gets that far.
      - run: |
          timeout 180 docker run --rm -e SPRING_CLOUD_GCP_SQL_ENABLED=false nanna:smoke 2>&1 | tee smoke.log || true
          grep -q "using Java" smoke.log

  docker-build:
    if: github.repository_owner == 'entur' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [maven-verify]
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      build_artifact_name: artifact
      build_artifact_path: target
  docker-push:
    needs: [docker-build, docker-smoke]
    uses: entur/gha-docker/.github/workflows/push.yml@v1

  docker-scan:
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  helm-lint:
    uses: entur/gha-helm/.github/workflows/lint.yml@v2
    with:
      environment: dev

  terraform-lint:
    uses: entur/gha-terraform/.github/workflows/lint.yml@v3
  tf-plan-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, docker-push ]
    name: Terraform Plan DEV
    uses: entur/gha-terraform/.github/workflows/plan.yml@v3
    with:
      environment: dev

  tf-approval-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-dev.outputs.has_changes == 'true' && github.ref == 'refs/heads/main' }}
    needs: [ tf-plan-dev ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve DEV tf plan"

  tf-apply-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-dev.outputs.has_changes == 'true' && github.ref == 'refs/heads/main' }}
    needs: [ tf-plan-dev, tf-approval-dev ]
    name: Terraform Apply DEV
    uses: entur/gha-terraform/.github/workflows/apply.yml@v3
    with:
      environment: dev
      has_changes: ${{ needs.tf-plan-dev.outputs.has_changes }}

  deploy-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main' }}
    needs: [ helm-lint, tf-plan-dev, tf-apply-dev, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: dev
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag }}
      chart: helm/nanna
      image_set_path: "image.identifier"
      namespace: nanna
      release_name: nanna
    secrets: inherit

  # Once this commit is in dev, older main runs still parked at an approval gate are
  # superseded. Runs that are actively deploying (in_progress) are left alone.
  cancel-superseded:
    if: ${{ !cancelled() && needs.deploy-dev.result == 'success' && github.event_name == 'push' }}
    needs: [ deploy-dev ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel older runs waiting for approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh run list -R "$GITHUB_REPOSITORY" --workflow push.yml --branch main --event push \
            --status waiting --limit 100 --json databaseId \
            --jq ".[] | select(.databaseId < $GITHUB_RUN_ID) | .databaseId") ||
            { echo "::warning::Could not list waiting runs"; exit 0; }
          for id in $ids; do
            # Re-check just before cancelling: the run may have been approved since the listing.
            status=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json status --jq .status) || status=unknown
            if [ "$status" != waiting ]; then
              echo "Skipping run $id: $status"
              continue
            fi
            echo "Cancelling superseded run $id"
            gh run cancel "$id" -R "$GITHUB_REPOSITORY" || echo "::warning::Could not cancel run $id"
          done

  # --- TST ---
  approval-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main' }}
    needs: [ deploy-dev, helm-lint, tf-plan-dev, tf-apply-dev, docker-push ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"

  tf-plan-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, approval-tst ]
    name: Terraform Plan TST
    uses: entur/gha-terraform/.github/workflows/plan.yml@v3
    with:
      environment: tst

  tf-approval-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-tst.outputs.has_changes == 'true' && github.ref == 'refs/heads/main' }}
    needs: [ tf-plan-tst ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST tf plan"

  tf-apply-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-tst.outputs.has_changes == 'true' && github.ref == 'refs/heads/main' }}
    needs: [ tf-plan-tst, tf-approval-tst ]
    name: Terraform Apply TST
    uses: entur/gha-terraform/.github/workflows/apply.yml@v3
    with:
      environment: tst
      has_changes: ${{ needs.tf-plan-tst.outputs.has_changes }}

  deploy-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main' }}
    needs: [ approval-tst, tf-plan-tst, tf-apply-tst, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: tst
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag }}
      chart: helm/nanna
      image_set_path: "image.identifier"
      namespace: nanna
      release_name: nanna
    secrets: inherit

  # --- PRD ---
  approval-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main' }}
    needs: [ deploy-tst, approval-tst, tf-plan-tst, tf-apply-tst, docker-push ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"

  tf-plan-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, approval-prd ]
    name: Terraform Plan PRD
    uses: entur/gha-terraform/.github/workflows/plan.yml@v3
    with:
      environment: prd

  tf-approval-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-prd.outputs.has_changes == 'true' && github.ref == 'refs/heads/main' }}
    needs: [ tf-plan-prd ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD tf plan"

  tf-apply-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-prd.outputs.has_changes == 'true' && github.ref == 'refs/heads/main' }}
    needs: [ tf-plan-prd, tf-approval-prd ]
    name: Terraform Apply PRD
    uses: entur/gha-terraform/.github/workflows/apply.yml@v3
    with:
      environment: prd
      has_changes: ${{ needs.tf-plan-prd.outputs.has_changes }}

  deploy-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main' }}
    needs: [ approval-prd, tf-plan-prd, tf-apply-prd, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: prd
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag }}
      chart: helm/nanna
      image_set_path: "image.identifier"
      namespace: nanna
      release_name: nanna
    secrets: inherit
