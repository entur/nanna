name: Dependabot automerge
on:
  pull_request:
jobs:
  maven-verify:
    env:
      JFROG_USER: ${{ secrets.ARTIFACTORY_AUTH_USER }}
      JFROG_PASS: ${{ secrets.ARTIFACTORY_AUTH_TOKEN }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Copy maven settings
        run: |
          wget --max-redirect=0 https://raw.githubusercontent.com/entur/ror-maven-settings/master/.m2/settings.xml -O .github/workflows/settings.xml
      # setup-java's liberica distribution can't select 25.0.5.0.3+5 (it maps to the same
      # semver as the vulnerable 25.0.5.0.2 GA build), so install the exact JDK from its tarball.
      - name: Download Liberica JDK 25.0.5.0.3+5
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/liberica.tar.gz" "https://github.com/bell-sw/Liberica/releases/download/25.0.5.0.3+5/bellsoft-jdk25.0.5.0.3+5-linux-amd64.tar.gz"
          echo "619c84961ce12dd1cd455719680e22d080bee63dbfe64711e2ef47243114e3ef  $RUNNER_TEMP/liberica.tar.gz" | sha256sum -c -
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/liberica.tar.gz
          java-version: 25.0.5
      - name: Cache Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-
            ${{ runner.os }}-
      - run: mvn verify -s .github/workflows/settings.xml
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: target/*.jar
  dependabot-automerge:
    permissions:
      contents: write
      pull-requests: write
    name: Dependabot automerge
    needs: maven-verify
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref,'auto-merge-')}}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve Dependabot PRs only patch and minor versions
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Enable auto-merge for Dependabot PRs - only for patch and minor versions
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}